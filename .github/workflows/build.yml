name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  OTP_VERSION: "28.0"
  ELIXIR_VERSION: "1.19.5-otp-28"
  NERVES_BOOTSTRAP_VERSION: "~> 1.15"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      # Free up disk on the runner — Buildroot output for a system with
      # WPE WebKit + Mesa3D + Wayland needs ~15 GB and the runner only
      # has ~14 GB free by default. Removing pre-installed toolchains we
      # don't use buys us ~25 GB.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install Buildroot host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool \
            libssl-dev libncurses-dev pkg-config \
            wget cpio file rsync python3 unzip bc \
            squashfs-tools curl ca-certificates git xz-utils

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Install hex / rebar / nerves_bootstrap
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix archive.install hex nerves_bootstrap "${{ env.NERVES_BOOTSTRAP_VERSION }}" --force

      - name: Cache Buildroot downloads
        uses: actions/cache@v4
        with:
          path: ~/.nerves/dl
          key: br-dl-${{ hashFiles('nerves_defconfig', 'mix.lock') }}
          restore-keys: |
            br-dl-

      - name: Get deps
        env:
          MIX_ENV: prod
        run: mix deps.get

      - name: Build the system
        env:
          MIX_ENV: prod
        run: mix compile

      - name: Locate built system tarball
        id: artifact
        run: |
          set -euo pipefail
          ARTIFACT=$(find _build ~/.nerves -name 'nerves_rp3_firmeware_kiosk-*.tar.gz' 2>/dev/null | head -1)
          if [ -z "$ARTIFACT" ]; then
            echo "::error::No built artifact found"
            find _build ~/.nerves -name '*.tar.gz' 2>/dev/null || true
            exit 1
          fi
          echo "path=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$ARTIFACT")" >> "$GITHUB_OUTPUT"
          ls -lh "$ARTIFACT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.path }}
          retention-days: 30

      - name: Create / update GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.artifact.outputs.path }}
          fail_on_unmatched_files: true
          generate_release_notes: true
